<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>貼り紙の見本</title>
<style>
 body{margin:0;padding:18px;background:#f4f6f8;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif}
 h1{font-size:16px;margin:0 0 4px} p.n{font-size:13px;color:#5f7183;margin:0 0 16px;line-height:1.7}
 .sheet{background:#fff;max-width:620px;margin:0 auto;padding:14mm;border:1px solid #dde3e9;border-radius:8px}
 .pc{border:1.5px dashed #999;border-radius:8px;padding:12mm 9mm;text-align:center;background:#fff}
 .pc .site{font-size:42pt;font-weight:800;line-height:1.2;margin:0 0 1mm}
 .pc .job {font-size:22pt;font-weight:700;color:#444;margin:0 0 5mm}
 .pc .ttl {font-size:26pt;font-weight:800;color:#0b3c5d;margin:0 0 6mm;border-top:2px solid #0b3c5d;border-bottom:2px solid #0b3c5d;padding:2mm 0}
 .pc .steps{list-style:none;margin:0 0 5mm;padding:0;text-align:left;display:inline-block}
 .pc .steps li{font-size:26pt;font-weight:700;line-height:1.5;margin:0 0 5mm;display:flex;align-items:flex-start;gap:4mm}
 .pc .steps .no{flex:none;width:13mm;height:13mm;border-radius:50%;background:#0b3c5d;color:#fff;font-size:19pt;display:flex;align-items:center;justify-content:center}
 .pc .warn{font-size:16pt;font-weight:700;color:#96271b;background:#fdecea;border-radius:6px;padding:4mm 5mm;margin-top:5mm;line-height:1.6}
</style></head><body>
<h1>現場の貼り紙の見本（A4に1枚・QRなし）</h1>
<p class="n">QRを入れず、やり方の手順だけにした形です。</p>
<div class="sheet"><div class="pc">
 <div class="site">さわ病院</div>
 <div class="job">日常清掃業務</div>
 <div class="ttl">出勤・退勤のしかた</div>
 <ul class="steps">
  <li><span class="no">1</span><span>自分の<b>カード</b>を出す</span></li>
  <li><span class="no">2</span><span>スマホの<b>カメラ</b>でQRを読む</span></li>
  <li><span class="no">3</span><span>来たとき「<b>出勤</b>」<br>帰るとき「<b>退勤</b>」を押す</span></li>
 </ul>
 <div class="warn">カードを忘れた方・はじめての方は 本社（06-6654-7812）までお電話ください</div>
</div></div>
</body></html>
