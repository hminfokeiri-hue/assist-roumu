<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>出勤の記録｜アシスト労務</title>
<!-- 2026-11-19 読み込みを速く：Firebaseの部品を読むあいだに、サーバーへの道を先に開いておく -->
<link rel="preconnect" href="https://www.gstatic.com">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<style>
:root{
--blue:#E8873A; --blue-dark:#C96A1E; --sun-soft:#F7DDBF;
--bg:#FBF6ED; --card:#fff; --border:#EDE2CE;
--text:#3A3530; --muted:#6B5F52; --danger:#C65D4B; --success:#4A7C6F;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP","Noto Sans CJK JP",Arial,sans-serif;
background:var(--bg);color:#111;font-weight:500;}
#app{max-width:480px;margin:0 auto;min-height:100vh;}
header.topbar{background:var(--blue);color:#fff;padding:16px 20px;}
header.topbar h1{font-size:18px;margin:0;font-weight:700;}
main{padding:20px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px;}
.site-name{font-size:26px;font-weight:700;text-align:center;margin:6px 0 4px;}
.site-sub{font-size:14px;color:var(--muted);text-align:center;margin-bottom:4px;}
.who{font-size:16px;text-align:center;color:var(--muted);margin-bottom:18px;}
.who b{color:#111;font-size:19px;}
label{display:block;font-size:15px;color:var(--muted);margin:14px 0 6px;}
input{width:100%;font-size:20px;padding:16px;border-radius:10px;border:1.5px solid var(--border);
background:#fff;color:#111;font-weight:500;text-align:center;letter-spacing:.1em;}
.big-btn{width:100%;border:none;border-radius:16px;padding:30px 12px;font-size:26px;font-weight:700;
color:#fff;background:var(--blue);font-family:inherit;cursor:pointer;line-height:1.3;}
.big-btn:active{background:var(--blue-dark);}
.big-btn.out{background:var(--success);}
.big-btn[disabled]{opacity:.5;}
/* 出勤・退勤ボタンの下の案内（押してもボタンと同じ動き） */
.hint-btn{width:100%;margin-top:10px;background:#FFF6E8;color:var(--blue-dark);border:2px dashed var(--blue);
border-radius:14px;padding:10px 12px 14px;font-family:inherit;font-size:17px;font-weight:700;line-height:1.5;cursor:pointer;}
.hint-btn .arrow{display:block;font-size:34px;line-height:1;margin-bottom:4px;animation:hintUp 1s ease-in-out infinite;}
.hint-btn.out{background:#EAF4F0;color:#2f5c50;border-color:var(--success);}
@keyframes hintUp{0%,100%{transform:translateY(4px);}50%{transform:translateY(-4px);}}
.sub-btn{width:100%;margin-top:12px;background:#fff;color:var(--blue);border:1.5px solid var(--blue);
border-radius:12px;padding:14px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;}
.done{text-align:center;padding:20px 0;}
.done .mark{font-size:56px;line-height:1;}
.done .msg{font-size:24px;font-weight:700;margin-top:10px;}
.done .time{font-size:40px;font-weight:700;margin-top:6px;letter-spacing:.02em;}
.done .note{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.7;}
.status{background:var(--sun-soft);border-radius:10px;padding:12px 14px;font-size:15px;
text-align:center;margin-bottom:16px;color:var(--blue-dark);font-weight:700;}
.err{color:var(--danger);font-size:15px;margin-top:10px;text-align:center;font-weight:700;}
.muted{color:var(--muted);font-size:13px;line-height:1.7;}
.center{text-align:center;}
.waiting{background:#fff8e1;border:1px solid #f0d98c;border-radius:10px;padding:12px;
font-size:14px;color:#6b5b0e;margin-top:14px;text-align:center;}
.ver{text-align:center;font-size:11px;color:#b3a692;padding:4px 0 18px;}
</style>
</head>
<body>
<div id="app">
<header class="topbar"><h1>出勤の記録</h1></header>
<main id="main"><div class="card center muted">読み込んでいます…</div></main>
<div class="ver">打刻ページ 2026-11-19</div>
</div>

<script>
/* つながりにくいときの案内。Firebaseの部品を読む前から時計を動かしておく */
var booted = false;
setTimeout(function(){
if (booted) return;
document.getElementById("main").innerHTML =
'<div class="card center"><p class="muted">つながりにくいようです。<br>' +
'電波のよい場所で、画面を下に引っぱって<br>読み込み直してください。</p></div>';
}, 12000);
</script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
const firebaseConfig = {
apiKey: "AIzaSyD1bprw7Xb6ZisnOkRKMlul_iW-rLvzf28",
authDomain: "assist-roumu.firebaseapp.com",
projectId: "assist-roumu",
storageBucket: "assist-roumu.firebasestorage.app",
messagingSenderId: "919904591114",
appId: "1:919904591114:web:33d30e66ea4264e081eef3"
};
/* このページ専用の入れ物（名前つき）。名前を分けておかないと、
同じ置き場所にあるアシスト労務（本体）とログインの記録を共有してしまい、
打刻ページを開いただけで本体のログインが消えてしまいます。 */
const dakokuApp = firebase.initializeApp(firebaseConfig, "dakoku");
const db = dakokuApp.firestore();
db.enablePersistence({ synchronizeTabs: true }).catch(function(){});

const LS_LOGIN = "assistRoumuLoginId";
const LS_CODE3 = "assistDakokuCode3";
/* この端末で一度サーバーに「この端末＝この従業員」を覚えさせたら、その印をここに残す。
   次からは覚えさせる書きこみを省き、鍵と名簿を同時に読む（待ち時間が短くなる） */
const LS_SESS = "assistDakokuSess";
function getSess(){ try{ return JSON.parse(localStorage.getItem(LS_SESS) || "null"); }catch(e){ return null; } }
function setSess(o){ try{ localStorage.setItem(LS_SESS, JSON.stringify(o)); }catch(e){} }
/* 電波・通信のエラーかどうか（「登録されていない」と取りちがえないため） */
function isNetErr(e){
var c = e && e.code ? String(e.code) : "";
if (c === "unavailable" || c === "deadline-exceeded") return true;
return /offline|network/i.test(String(e && e.message || ""));
}
/* 成功・失敗のどちらでも止まらずに結果を受け取る（同時に読むため） */
function settle(p){ return p.then(function(v){ return { ok:true, v:v }; }, function(e){ return { ok:false, e:e }; }); }

var state = { site:null, siteId:null, emp:null, today:null, rec:null, busy:false, err:"" };

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function el(id){ return document.getElementById(id); }
function todayStr(){
var d = new Date();
return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function hhmm(ts){
if (!ts) return "";
var d = ts.toDate ? ts.toDate() : new Date(ts);
return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
function nospace(s){ return String(s==null?"":s).replace(/[\s　]/g,""); }
function last3(code){ return String(code||"").replace(/[^0-9]/g,"").slice(-3); }
/* 従業員コードが変わっても、本社が「本人カードの番号」を入れておけば前のカードで打刻できる */
function codeOk(emp, c3){ c3=String(c3||""); if (!c3) return false; if (last3(emp.employeeCode) === c3) return true; return !!emp.cardCode3 && last3(emp.cardCode3) === c3; }

function render(html){ booted = true; el("main").innerHTML = html; }

/* ログインの鍵で本人を確かめ、「この端末＝この従業員」をサーバーに覚えさせる。
   鍵がまだ無いとき（切りかえ前）は、今までのやり方（ログインIDでさがす）で確かめる。
   見つからなければ null。電波がなくて確かめられなかったときはエラーを投げる */
async function findEmp(loginId, code3){
var key = String(loginId) + "_" + String(code3);
var u = dakokuApp.auth().currentUser;
var netErr = !u;
/* 早道：この端末で前に確かめた人なら、サーバーはもう覚えているので、鍵と名簿を同時に読む */
var c = getSess();
if (u && c && c.uid === u.uid && c.key === key && c.empId){
try{
var both = await Promise.all([
db.collection("loginKeys").doc(key).get(),
db.collection("employees").doc(c.empId).get()
]);
if (both[0].exists && both[0].data().employeeId === c.empId && both[1].exists){
return Object.assign({ id: both[1].id }, both[1].data());
}
}catch(e){ if (isNetErr(e)) throw e; }
}
/* ふつうの道（はじめての端末・カードが変わったとき）：今までどおり順番に確かめる */
try{
var k = await db.collection("loginKeys").doc(key).get();
if (k.exists){
var empId = k.data().employeeId;
if (u){
await db.collection("sessions").doc(u.uid).set({ employeeId: empId, key: key, at: firebase.firestore.FieldValue.serverTimestamp() });
setSess({ uid: u.uid, key: key, empId: empId });
}
var d = await db.collection("employees").doc(empId).get();
if (d.exists) return Object.assign({ id: d.id }, d.data());
}
}catch(e){ if (isNetErr(e)) netErr = true; }
var snap = null;
try{ snap = await db.collection("employees").where("loginId","==",loginId).limit(1).get(); }
catch(e){ if (isNetErr(e)) netErr = true; }
if (snap && !snap.empty) return Object.assign({ id: snap.docs[0].id }, snap.docs[0].data());
if (netErr) throw new Error("offline");
return null;
}

/* 現場をさがす（?site=ID または ?g=現場名）。見つからなければ null、電波のエラーは投げる */
async function findSite(siteId, gname){
try{
if (siteId){
var d = await db.collection("sites").doc(siteId).get();
return d.exists ? { id: siteId, data: d.data() } : null;
}
if (gname){
var q = await db.collection("sites").where("name","==",gname).limit(1).get();
if (!q.empty) return { id: q.docs[0].id, data: q.docs[0].data() };
var all = await db.collection("sites").get();
var t = nospace(gname), hit = null;
all.forEach(function(d){
if (!hit && nospace((d.data()||{}).name) === t) hit = { id: d.id, data: d.data() };
});
return hit;
}
}catch(e){ if (isNetErr(e)) throw e; }
return null;
}

function renderLogin(){
var saved = localStorage.getItem(LS_LOGIN) || "";
render(
'<div class="card">' +
(state.site ? '<div class="site-name">' + esc(state.site.name) + '</div><div class="site-sub">この現場に出勤します</div>' : '') +
'<p class="muted center" style="margin-top:14px">はじめだけ入力してください。<br>次からは読み取るだけで出勤できます。<br>本人カードをお持ちの方は、そのQRを読むだけで済みます。</p>' +
'<label>ログインID（8桁）</label>' +
'<input id="inLogin" type="tel" inputmode="numeric" maxlength="8" placeholder="12345678" value="' + esc(saved) + '">' +
'<label>管理番号の下3桁</label>' +
'<input id="inCode" type="tel" inputmode="numeric" maxlength="3" placeholder="001">' +
'<button class="big-btn" style="margin-top:20px;padding:20px;font-size:20px" onclick="doLogin()">つぎへ</button>' +
(state.err ? '<div class="err">' + esc(state.err) + '</div>' : '') +
'</div>'
);
}

async function doLogin(){
var loginId = (el("inLogin").value||"").trim();
var code3 = (el("inCode").value||"").trim();
if (!loginId || !code3){ state.err = "両方を入力してください"; return renderLogin(); }
state.err = "";
render('<div class="card center muted">確認しています…</div>');
try{
var emp = await findEmp(loginId, code3.padStart(3,"0"));
if (!emp){ state.err = "ログインIDが見つかりません"; return renderLogin(); }
if (!codeOk(emp, code3.padStart(3,"0"))){
state.err = "管理番号の下3桁が違います"; return renderLogin();
}
localStorage.setItem(LS_LOGIN, loginId);
localStorage.setItem(LS_CODE3, code3.padStart(3,"0"));
state.emp = emp;
await loadRecord();
renderMain();
}catch(e){
state.err = "つながりませんでした。電波を確かめてもう一度おしてください。";
renderLogin();
}
}

function recId(){ return state.today + "_" + state.emp.id + "_" + state.siteId; }

async function loadRecord(recP){
state.today = todayStr();
if (recP){
var pre = await recP;
if (pre && pre.empId === state.emp.id && pre.siteId === state.siteId && pre.today === state.today){
state.rec = pre.rec; return;
}
}
try{
var d = await db.collection("attendance").doc(recId()).get();
state.rec = d.exists ? d.data() : null;
}catch(e){ state.rec = null; }
}

/* 現場の「予定の時間」を従業員の画面に出すかどうか。
   いまは仮の時間しか登録していないので、出さない（false）。正しい時間がそろったら true にもどす。 */
var SHOW_SITE_TIME = false;

function renderMain(){
var s = state.site, r = state.rec;
var head =
'<div class="card">' +
'<div class="site-name">' + esc(s ? s.name : "現場が未設定") + '</div>' +
(SHOW_SITE_TIME && s && s.startTime ? '<div class="site-sub">予定 ' + esc(s.startTime) + '〜' + esc(s.endTime||"") + '</div>' : '') +
'<div class="who">' + esc(state.emp.name||"") + ' さん</div>';

if (!r){
render(head +
'<button class="big-btn" onclick="punch(\'in\')">出勤</button>' +
'<button class="hint-btn" onclick="punch(\'in\')"><span class="arrow">⬆</span>' +
'この「出勤」ボタンを<br>押すと、出勤になります。<br>かならず押してくださいね</button>' +
'<button class="sub-btn" onclick="switchUser()">ちがう人が使う</button>' +
'</div>');
return;
}
if (r && r.inAt && !r.outAt){
render(head +
'<div class="status">' + hhmm(r.inAt) + ' に出勤しました</div>' +
'<button class="big-btn out" onclick="punch(\'out\')">退勤</button>' +
'<button class="hint-btn out" onclick="punch(\'out\')"><span class="arrow">⬆</span>' +
'帰るときは、この「退勤」ボタンを<br>押してくださいね</button>' +
'<button class="sub-btn" onclick="switchUser()">ちがう人が使う</button>' +
'</div>');
return;
}
render(head +
'<div class="done">' +
'<div class="mark">✓</div>' +
'<div class="msg">きょうはおつかれさまでした</div>' +
'<div class="note">出勤 ' + hhmm(r.inAt) + ' ／ 退勤 ' + hhmm(r.outAt) + '</div>' +
'</div>' +
'<button class="sub-btn" onclick="switchUser()">ちがう人が使う</button>' +
'</div>');
}

async function punch(kind){
if (state.busy) return;
state.busy = true;
var now = firebase.firestore.FieldValue.serverTimestamp();
var ref = db.collection("attendance").doc(recId());
var data = {
date: state.today,
employeeId: state.emp.id,
employeeName: state.emp.name || "",
employeeCode: state.emp.employeeCode || "",
area: state.emp.area || "",
siteId: state.siteId,
siteName: state.site ? state.site.name : "",
source: "qr"
};
if (kind === "in") data.inAt = now; else data.outAt = now;

var localTime = new Date();
var shown = String(localTime.getHours()).padStart(2,"0") + ":" + String(localTime.getMinutes()).padStart(2,"0");
render(
'<div class="card"><div class="done">' +
'<div class="mark">✓</div>' +
'<div class="msg">' + (kind==="in" ? "出勤しました" : "退勤しました") + '</div>' +
'<div class="time">' + shown + '</div>' +
'<div class="note">' + esc(state.site ? state.site.name : "") + '<br>' + esc(state.emp.name||"") + ' さん</div>' +
'<div id="sendState" class="waiting">送信しています…</div>' +
'</div></div>'
);

ref.set(data, { merge:true }).then(function(){
var e = el("sendState");
if (e){ e.className = "waiting"; e.style.background = "#e3f3ea"; e.style.borderColor = "#a8cfc2";
e.style.color = "#2f5c50"; e.textContent = "本社に届きました"; }
}).catch(function(){
var e = el("sendState");
if (e) e.textContent = "電波が戻ったら自動で送られます。このまま閉じて大丈夫です。";
});

setTimeout(function(){ state.busy = false; }, 1500);
}

function switchUser(){
localStorage.removeItem(LS_LOGIN);
localStorage.removeItem(LS_CODE3);
localStorage.removeItem(LS_SESS);
state.emp = null; state.rec = null; state.err = "";
renderLogin();
}

var NET_MSG = '<div class="card center"><p class="muted">つながりませんでした。<br>電波のよい場所でもう一度お試しください。</p></div>';

/* ---------- 起動 ----------
   2026-11-19：これまでは「本人カードの確認 → 現場 → もう一度本人の確認 → きょうの記録」を
   1つずつ順番に待っていたため、電波の弱い所で時間がかかっていた。
   いまは、現場・本人・きょうの記録を同時に読みはじめ、本人の確認も1回だけにした。
   本人カード（?me=ログインID-下3けた）を読んだときは、そのカードの人をこの端末に覚えさせる */
async function boot(){
var params = new URLSearchParams(location.search);
state.siteId = params.get("site");
state.today = todayStr();
var gname = params.get("g");
var me = params.get("me");

try{ await dakokuApp.auth().signInAnonymously(); }catch(e){}

/* だれが使うか：本人カードがあればそのカードの人、なければこのスマホが覚えている人 */
var fromCard = false, loginId = null, code3 = null;
if (me){
var p = String(me).split("-");
var mid = (p[0]||"").replace(/[^0-9]/g,"");
var mc  = last3(p[1]||"");
if (mid && mc){ loginId = mid; code3 = mc; fromCard = true; }
}
if (!fromCard){
loginId = localStorage.getItem(LS_LOGIN);
code3 = localStorage.getItem(LS_CODE3);
}
var hasWho = !!(loginId && code3);
var hasSite = !!(state.siteId || gname);

/* ここで同時に読みはじめる（待つのは、いちばん遅いもの1つぶんだけ） */
var siteP = hasSite ? settle(findSite(state.siteId, gname)) : Promise.resolve({ ok:true, v:null });
var empP = (hasWho && (hasSite || fromCard)) ? settle(findEmp(loginId, code3)) : Promise.resolve({ ok:true, v:null });
var recP = null;
var c = getSess();
if (hasWho && state.siteId && c && c.key === String(loginId) + "_" + String(code3) && c.empId){
var pre = { empId: c.empId, siteId: state.siteId, today: state.today, rec: null };
recP = db.collection("attendance").doc(state.today + "_" + c.empId + "_" + state.siteId).get()
.then(function(d){ pre.rec = d.exists ? d.data() : null; return pre; })
.catch(function(){ return null; });
}

if (fromCard){
var cr = await empP;
if (!cr.ok){ render(NET_MSG); return; }
if (!cr.v){
render('<div class="card center"><p class="muted">このカードは登録されていません。<br>本社にお知らせください。</p></div>');
return;
}
if (!codeOk(cr.v, code3)){
render('<div class="card center"><p class="muted">このカードは読み取れませんでした。<br>本社にお知らせください。</p></div>');
return;
}
localStorage.setItem(LS_LOGIN, loginId);
localStorage.setItem(LS_CODE3, code3);
state.emp = cr.v;
if (!hasSite){
render(
'<div class="card"><div class="done">' +
'<div class="mark">✓</div>' +
'<div class="msg">' + esc(state.emp.name||"") + ' さん</div>' +
'<div class="note">このスマホに登録しました。<br>つづけて<b>現場のQR</b>を読んでください。<br><br>' +
'これからは、現場のQRを読むだけで<br>出勤・退勤ができます。</div>' +
'</div></div>'
);
return;
}
}

var sr = await siteP;
if (!sr.ok){ render(NET_MSG); return; }
if (sr.v){ state.siteId = sr.v.id; state.site = sr.v.data; }
if (!state.siteId){
render('<div class="card center"><p class="muted">現場のQRコードを読み取って開いてください。</p></div>');
return;
}
if (!state.site){
render('<div class="card center"><p class="muted">この現場は登録されていません。<br>本社にお知らせください。</p></div>');
return;
}

if (!state.emp){
if (!hasWho) return renderLogin();
var er = await empP;
if (!er.ok){ render(NET_MSG); return; }
if (!er.v || !codeOk(er.v, code3)) return renderLogin();
state.emp = er.v;
}
try{
await loadRecord(recP);
renderMain();
}catch(e){
render(NET_MSG);
}
}
boot();
</script>
</body>
</html>
