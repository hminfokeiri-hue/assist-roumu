<html lang="ja">

<style>
:root{
--blue:#E8873A; --blue-dark:#C96A1E; --sun-soft:#F7DDBF;
--bg:#FBF6ED; --card:#fff; --border:#EDE2CE;
--text:#3A3530; --muted:#6B5F52; --danger:#C65D4B; --success:#4A7C6F; --warning:#C08A2B;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;
background:var(--bg);color:var(--text);font-size:14px;line-height:1.6;}
#app{max-width:1100px;margin:0 auto;min-height:100vh;}
header.topbar{background:var(--blue);color:#fff;padding:14px 20px;display:flex;
align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
header.topbar h1{font-size:18px;margin:0;font-weight:700;}
header.topbar h1 small{font-size:12px;font-weight:400;opacity:.9;margin-left:6px;}
.hright{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;}
.hbtn{background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:8px;
padding:8px 12px;font-size:13px;font-family:inherit;cursor:pointer;}
main{padding:20px;}
.tabbar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tabbar button{background:#fff;border:1.5px solid var(--border);border-radius:10px;
padding:9px 14px;font-size:13px;font-weight:700;color:var(--text);
font-family:inherit;cursor:pointer;}
.tabbar button.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.tabbar a{background:#fff;border:1.5px solid var(--border);border-radius:10px;
padding:9px 14px;font-size:13px;font-weight:700;color:var(--text);
text-decoration:none;display:inline-block;line-height:1.4;}
.tabbar a.link{background:transparent;border-style:dashed;color:var(--muted);}
.tabbar a.link:hover{color:var(--blue);border-color:var(--blue);}
a.btn{display:inline-block;text-decoration:none;line-height:1.4;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px;}
input,select,textarea{width:100%;font-size:15px;padding:10px;border-radius:10px;
border:1.5px solid var(--border);background:#fff;font-family:inherit;color:var(--text);}
.btn{border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:700;
font-family:inherit;cursor:pointer;background:var(--blue);color:#fff;}
.btn.sec{background:#fff;color:var(--blue);border:1.5px solid var(--blue);}
.btn.del{background:#fff;color:var(--danger);border:1.5px solid var(--danger);}
.btn.sm{padding:6px 12px;font-size:13px;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
.row > div{flex:1;min-width:130px;}
.muted{color:var(--muted);font-size:13px;}
.center-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;}
.login-card{width:100%;max-width:380px;}
.login-card h1{font-size:22px;color:var(--blue);text-align:center;margin:0 0 4px;}
.login-card p.sub{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px;}

.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
.site-card{background:#fff;border:1px solid var(--border);border-left:8px solid var(--border);
border-radius:12px;padding:14px 16px;}
.site-card.ok{border-left-color:#4A7C6F;}
.site-card.few{border-left-color:#C08A2B;}
.site-card.wait{border-left-color:#C9C4B8;}
.site-card.ng{border-left-color:#C65D4B;background:#FEF0EE;}
.sc-name{font-size:17px;font-weight:700;}
.sc-time{font-size:12px;color:var(--muted);margin-top:2px;}
.sc-state{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;
border-radius:20px;margin-top:8px;}
.st-ok{background:#e3f3ea;color:var(--success);}
.st-few{background:#fdf0d5;color:var(--warning);}
.st-wait{background:#f0ece5;color:var(--muted);}
.st-ng{background:#fbe6e4;color:var(--danger);}
.sc-people{margin-top:10px;font-size:13px;}
.sc-person{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #F5EFE4;}
.sc-person:last-child{border-bottom:none;}
.sc-person .t{color:var(--muted);}
.sec-title{font-size:15px;font-weight:700;margin:22px 0 10px;}
.memo-box{width:100%;min-height:70px;resize:vertical;}
.sum{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:16px;}
.sum div{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px 18px;}
.sum .n{font-size:24px;font-weight:700;}
.sum .l{font-size:12px;color:var(--muted);}
table{width:100%;border-collapse:collapse;font-size:14px;}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);}
th{color:var(--muted);font-weight:700;font-size:12px;}
.wd{display:flex;gap:6px;flex-wrap:wrap;}
.wd label{display:flex;align-items:center;gap:4px;margin:0;font-size:14px;color:var(--text);
background:#fff;border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;cursor:pointer;}
.wd input{width:auto;}
.dt{display:flex;flex-direction:column;gap:6px;max-width:460px;}
.dt-row{display:flex;align-items:center;gap:8px;}
.dt-row input[type=time]{flex:1;min-width:0;padding:8px;font-size:15px;}
.dt-row.off input[type=time]{opacity:.35;}
.dt-sep{color:var(--muted);}
.dt-day{display:flex;align-items:center;gap:6px;margin:0;width:64px;flex-shrink:0;font-size:16px;font-weight:700;color:var(--text);cursor:pointer;}
.dt-day input{width:18px;height:18px;margin:0;}
.dt-row.hol .dt-day{color:var(--danger);}
.wd label.hol{border-color:var(--danger);color:var(--danger);font-weight:700;margin-left:6px;}
.qr-sheet{background:#fff;border:2px solid #333;border-radius:6px;padding:24px;text-align:center;
max-width:420px;margin:0 auto 20px;}
.qr-sheet h2{font-size:26px;margin:0 0 4px;}
.qr-sheet .qbox{display:flex;justify-content:center;margin:16px 0;}
.qr-sheet p{font-size:14px;color:#333;margin:6px 0 0;}
.privacy{font-size:13px;color:var(--muted);}
@media print{
@page{size:A4 portrait;margin:12mm;}
body *{visibility:hidden;}
.print-target,.print-target *{visibility:visible;}
.print-target{position:absolute;top:0;left:0;width:100%;}
.no-print{display:none !important;}
.qr-sheet{page-break-after:always;border-color:#000;}
}
@media(max-width:700px){ .row > div{min-width:100%;} }
</style>

<div id="app"><div class="center-screen"><p class="muted">読み込んでいます…</p></div></div>

<script>
const firebaseConfig = {
apiKey: "AIzaSyD1bprw7Xb6ZisnOkRKMlul_iW-rLvzf28",
authDomain: "assist-roumu.firebaseapp.com",
projectId: "assist-roumu",
storageBucket: "assist-roumu.firebasestorage.app",
messagingSenderId: "919904591114",
appId: "1:919904591114:web:33d30e66ea4264e081eef3"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
// 【読み取り節約】読んだデータを端末に残す（開き直しても30分以内なら変わった分だけ読む）
try { db.enablePersistence({ synchronizeTabs: true }).catch(function(){}); } catch(e) {}
var watchTimer = null;

const WD = ["日","月","火","水","木","金","土"];
const GRACE_MIN = 15;

/* ---- 日本の祝日（「国民の祝日に関する法律」どおりに計算します） ----
・第2条の祝日16日（成人の日・海の日・敬老の日・スポーツの日は第○月曜日）
・春分の日・秋分の日は計算式（1980〜2099年まで正しい値になります）
・第3条第2項：日曜と重なった祝日は、次の「祝日でない日」が休日（振替休日）
・第3条第3項：前の日と次の日が祝日の日は休日（国民の休日。例：2026年9月22日）
※オリンピックのときのような臨時の祝日は入っていません。
※viewer.html（リーダー用）と同じ計算です。法律が変わったら両方を直します。 */
var HOLIDAY_CACHE = {};
function jpHolidays(y){
if (HOLIDAY_CACHE[y]) return HOLIDAY_CACHE[y];
var p = function(n){ return String(n).padStart(2,"0"); };
var key = function(m,d){ return y+"-"+p(m)+"-"+p(d); };
var nthMonday = function(m,n){ var first = new Date(y,m-1,1).getDay(); return 1 + ((1-first+7)%7) + (n-1)*7; };
var shunbun = Math.floor(20.8431 + 0.242194*(y-1980) - Math.floor((y-1980)/4));
var shubun  = Math.floor(23.2488 + 0.242194*(y-1980) - Math.floor((y-1980)/4));
var h = {};
h[key(1,1)] = "元日";
h[key(1,nthMonday(1,2))] = "成人の日";
h[key(2,11)] = "建国記念の日";
h[key(2,23)] = "天皇誕生日";
h[key(3,shunbun)] = "春分の日";
h[key(4,29)] = "昭和の日";
h[key(5,3)] = "憲法記念日";
h[key(5,4)] = "みどりの日";
h[key(5,5)] = "こどもの日";
h[key(7,nthMonday(7,3))] = "海の日";
h[key(8,11)] = "山の日";
h[key(9,nthMonday(9,3))] = "敬老の日";
h[key(9,shubun)] = "秋分の日";
h[key(10,nthMonday(10,2))] = "スポーツの日";
h[key(11,3)] = "文化の日";
h[key(11,23)] = "勤労感謝の日";
/* 振替休日：日曜と重なったら、次の「祝日でない日」にずらす */
Object.keys(h).forEach(function(k){
var d = new Date(k.replace(/-/g,"/"));
if (d.getDay() !== 0) return;
var n = new Date(d);
do { n.setDate(n.getDate()+1); } while (h[key(n.getMonth()+1, n.getDate())]);
h[key(n.getMonth()+1, n.getDate())] = "振替休日";
});
/* 国民の休日：祝日と祝日にはさまれた日（日曜はもともと休みなので除く） */
var d = new Date(y,0,1);
while (d.getFullYear() === y){
var k = key(d.getMonth()+1, d.getDate());
if (!h[k] && d.getDay() !== 0){
var a = new Date(d); a.setDate(a.getDate()-1);
var b = new Date(d); b.setDate(b.getDate()+1);
if (h[key(a.getMonth()+1,a.getDate())] && h[key(b.getMonth()+1,b.getDate())]) h[k] = "国民の休日";
}
d.setDate(d.getDate()+1);
}
HOLIDAY_CACHE[y] = h;
return h;
}
function holidayName(ymd){
if (!ymd) return "";
return jpHolidays(Number(String(ymd).slice(0,4)))[ymd] || "";
}
/* その現場が、その日に入る予定かどうか
・祝日の日 … 「祝」にチェックがある現場だけ入る（ほとんどの現場は祝日は休み）
・ふつうの日 … 曜日で決めます */
function isPlannedOn(site, ymd){
if (holidayName(ymd)) return site.holiday === true;
var wd = new Date(String(ymd).replace(/-/g,"/")).getDay();
return Array.isArray(site.weekdays) ? site.weekdays.indexOf(wd) >= 0 : false;
}

/* ---- 曜日ごとの時間 ----
sites の dayTimes に { "1":{s:"07:30",e:"11:00"}, … "0":日曜, "h":祝日 } の形で入れます。
前から登録してある現場（dayTimes が無い）は、今までの startTime／endTime をどの曜日にも使います。
startTime／endTime は「代表の時間」として残します（打刻画面やまとめて登録のため）。 */
var DAY_ORDER = ["1","2","3","4","5","6","0","h"];
function dayLabel(k){ return k === "h" ? "祝" : WD[+k]; }
function dayTimeOf(site, k){
var t = site.dayTimes && site.dayTimes[k];
if (t && t.s) return { s:t.s, e:t.e || "" };
if (k === "h"){ /* 祝日の時間が空なら、その日の曜日の時間を使う */
var wd = String(new Date(String(state.today || todayStr()).replace(/-/g,"/")).getDay());
var w = site.dayTimes && site.dayTimes[wd];
if (w && w.s) return { s:w.s, e:w.e || "" };
}
return { s:site.startTime || "", e:site.endTime || "" };
}
/* その日に使う時間 */
function timeOn(site, ymd){
if (holidayName(ymd)) return dayTimeOf(site, "h");
return dayTimeOf(site, String(new Date(String(ymd).replace(/-/g,"/")).getDay()));
}
/* 一覧用：「月・水・木・金 07:30〜11:00／火 09:00〜12:00」のように、同じ時間の曜日をまとめる */
function timeSummary(site){
var on = DAY_ORDER.filter(function(k){
return k === "h" ? site.holiday === true : (Array.isArray(site.weekdays) && site.weekdays.indexOf(+k) >= 0);
});
if (!on.length) return site.startTime ? esc(site.startTime) + (site.endTime ? "〜" + esc(site.endTime) : "") : "";
var groups = [];
on.forEach(function(k){
var t = dayTimeOf(site, k), txt = t.s ? t.s + (t.e ? "〜" + t.e : "") : "時間なし";
var g = groups.filter(function(x){ return x.txt === txt; })[0];
if (g) g.days.push(k); else groups.push({ txt:txt, days:[k] });
});
if (groups.length === 1) return esc(groups[0].txt);
return groups.map(function(g){
return '<span style="white-space:nowrap">' + g.days.map(dayLabel).join("・") + " " + esc(g.txt) + '</span>';
}).join("<br>");
}

var state = {
user:null, tab:"board", sites:[], attend:[], memo:"", today:"",
editing:null, soundOn:false, privacy:false, redSet:{}, qrSite:null, unsub:[]
};

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function el(id){ return document.getElementById(id); }
function todayStr(){ var d=new Date();
return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function hhmm(ts){ if(!ts) return "";
var d = ts.toDate ? ts.toDate() : new Date(ts);
return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function toMin(t){ if(!t) return null; var p=String(t).split(":"); return parseInt(p[0],10)*60+parseInt(p[1]||0,10); }

/* ---------- ログイン ---------- */
function renderLogin(msg){
el("app").innerHTML =
'<div class="center-screen"><div class="card login-card">' +
'<h1>信号板</h1><p class="sub">アシスト労務・本社用</p>' +
'<label>メールアドレス</label><input id="lgMail" type="email" autocomplete="username">' +
'<label style="margin-top:12px">パスワード</label><input id="lgPw" type="password" autocomplete="current-password">' +
'<label style="margin-top:12px;display:flex;align-items:center;gap:8px;color:var(--text)">' +
'<input type="checkbox" id="lgSave" style="width:auto" checked> パスワードを保存する</label>' +
'<button class="btn" style="width:100%;margin-top:16px" onclick="doLogin()">ログイン</button>' +
(msg ? '<p class="sub" style="color:var(--danger);margin-top:12px">'+esc(msg)+'</p>' : '') +
'</div></div>';
var m = localStorage.getItem("shingobanMail");
if (m) el("lgMail").value = m;
}
function doLogin(){
var mail = el("lgMail").value.trim(), pw = el("lgPw").value;
var save = el("lgSave").checked;
firebase.auth().signInWithEmailAndPassword(mail, pw).then(function(){
if (save) localStorage.setItem("shingobanMail", mail); else localStorage.removeItem("shingobanMail");
}).catch(function(){ renderLogin("メールかパスワードが違います"); });
}
function doLogout(){
if(!confirm("ログアウトしますか？")) return;
state.unsub.forEach(function(u){ try{u();}catch(e){} });
state.unsub = [];
if (watchTimer) { clearInterval(watchTimer); watchTimer = null; }
firebase.auth().signOut();
}

/* ---------- 購読 ---------- */
function startWatch(){
state.today = todayStr();
state.unsub.forEach(function(u){ try{u();}catch(e){} });
state.unsub = [];
state.unsub.push(db.collection("sites").onSnapshot(function(s){
state.sites = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
render();
}));
state.unsub.push(db.collection("attendance").where("date","==",state.today).onSnapshot(function(s){
state.attend = s.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
render();
}));
state.unsub.push(db.collection("boardMemos").doc(state.today).onSnapshot(function(d){
state.memo = d.exists ? (d.data().text || "") : "";
var t = el("memoBox");
if (t && document.activeElement !== t) t.value = state.memo;
}));
// 【読み取り節約】日付が変わるたびにタイマーが増えないよう、1つだけにする
if (watchTimer) clearInterval(watchTimer);
watchTimer = setInterval(function(){
if (todayStr() !== state.today) startWatch(); else render();
}, 60000);
}

/* ---------- 判定 ---------- */
function siteStatus(site){
var list = state.attend.filter(function(a){ return a.siteId === site.id; });
var planned = isPlannedOn(site, state.today || todayStr());
var need = parseInt(site.headcount,10) || 0;
var tt = timeOn(site, state.today || todayStr());
var start = toMin(tt.s);
var cls, label;
if (list.length > 0){
if (need && list.length < need){ cls="few"; label="出勤 "+list.length+"／"+need+"名"; }
else { cls="ok"; label="出勤 "+list.length+"名"; }
} else if (!planned){
cls="wait"; label="今日は予定なし";
} else if (start !== null && nowMin() >= start + GRACE_MIN){
cls="ng"; label="未出勤";
} else {
cls="wait"; label="まだ時間前";
}
return { cls:cls, label:label, list:list, planned:planned, time:tt };
}

/* ---------- 音 ---------- */
var audioCtx = null;
function enableSound(){
try{
audioCtx = new (window.AudioContext||window.webkitAudioContext)();
var o = audioCtx.createOscillator(), g = audioCtx.createGain();
g.gain.value = 0.0001; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.01);
state.soundOn = true; render();
}catch(e){ alert("この画面では音を出せませんでした"); }
}
function beep(){
if (!state.soundOn || !audioCtx) return;
try{
var o = audioCtx.createOscillator(), g = audioCtx.createGain();
o.type = "sine"; o.frequency.value = 880;
g.gain.setValueAtTime(0.25, audioCtx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+0.7);
o.connect(g); g.connect(audioCtx.destination);
o.start(); o.stop(audioCtx.currentTime+0.7);
}catch(e){}
}

/* ---------- ほかのページへ ---------- */
var BASE_URL = "https://hminfokeiri-hue.github.io/assist-roumu/";
function pageUrl(f){ return BASE_URL + f + "?v=" + Date.now(); }

/* ---------- 画面 ---------- */
function render(){
if (!state.user) return;
if (state.tab === "sites" && state.editing) captureForm();
var head =
'<header class="topbar no-print"><h1>信号板<small>｜アシスト労務</small></h1><div class="hright">' +
'<span>' + esc(state.today) + '（' + WD[new Date().getDay()] + '）' +
(holidayName(state.today) ? ' 🎌' + esc(holidayName(state.today)) : '') + '</span>' +
(state.soundOn ? '<span>🔔 音あり</span>' : '<button class="hbtn" onclick="enableSound()">🔕 音を出す</button>') +
'<button class="hbtn" onclick="state.privacy=!state.privacy;render()">' + (state.privacy?"名前を表示":"名前を隠す") + '</button>' +
'<button class="hbtn" onclick="doLogout()">ログアウト</button>' +
'</div></header>' +
'<main><div class="tabbar no-print">' +
tabBtn("board","🚦 信号板") + tabBtn("sites","📍 現場の登録") + tabBtn("qr","🖨️ QRを印刷") +
'<a class="link" href="'+pageUrl("genba-ikkatsu.html")+'" target="_blank" rel="noopener" title="アシストカレンダーから現場をまとめて登録／QRをまとめて印刷">📦 まとめて登録・QR一括 ↗</a>' +
'<a class="link" href="'+pageUrl("shukei.html")+'" target="_blank" rel="noopener" title="月の出勤日数と実働時間を集計して弥生の取込CSVを作る">🧮 勤怠集計・弥生CSV ↗</a>' +
'</div>';
var body = state.tab==="board" ? viewBoard() : state.tab==="sites" ? viewSites() : viewQr();
el("app").innerHTML = head + body + '</main>';
if (state.tab === "qr") drawQr();
if (state.tab === "board"){ var t = el("memoBox"); if (t) t.value = state.memo; }
}
function tabBtn(id,label){
return '<button class="'+(state.tab===id?"active":"")+'" onclick="state.tab=\''+id+'\';render()">'+label+'</button>';
}

function viewBoard(){
var sites = state.sites.slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||"","ja"); });
if (!sites.length) return '<div class="card"><p class="muted">現場がまだ登録されていません。「現場の登録」から追加してください。</p></div>';

var today = [], other = [], ng = 0, ok = 0;
sites.forEach(function(s){
var st = siteStatus(s);
if (st.cls === "ng") ng++;
if (st.cls === "ok" || st.cls === "few") ok++;
(st.planned || st.list.length ? today : other).push({ site:s, st:st });
});

var newRed = {};
today.forEach(function(x){ if (x.st.cls === "ng") newRed[x.site.id] = 1; });
var appeared = Object.keys(newRed).some(function(k){ return !state.redSet[k]; });
state.redSet = newRed;
if (appeared) beep();

var card = function(x){
var s = x.site, st = x.st;
var people = st.list.map(function(a){
var name = state.privacy ? "－" : esc(a.employeeName||"");
var time = hhmm(a.inAt) + (a.outAt ? " 〜 " + hhmm(a.outAt) : " 〜");
return '<div class="sc-person"><span>'+name+'</span><span class="t">'+time+'</span></div>';
}).join("");
return '<div class="site-card '+st.cls+'">' +
'<div class="sc-name">'+esc(s.name)+'</div>' +
'<div class="sc-time">'+ (st.time.s ? esc(st.time.s)+"〜"+esc(st.time.e||"") : "時間の予定なし") +
(s.headcount ? ' '+esc(s.headcount)+'名' : '') + '</div>' +
'<div class="sc-state st-'+st.cls+'">'+st.label+'</div>' +
(people ? '<div class="sc-people">'+people+'</div>' : '') +
'</div>';
};

var hol = holidayName(state.today);
var holNote = hol ? '<div class="card no-print" style="border-left:6px solid var(--warning);padding:12px 16px">' +
'🎌 今日は祝日（' + esc(hol) + '）です。「祝」にチェックのある現場だけを「今日の現場」にしています。' +
'</div>' : '';
return holNote + '<div class="sum">' +
'<div><div class="n">'+today.length+'</div><div class="l">今日の現場</div></div>' +
'<div><div class="n" style="color:var(--success)">'+ok+'</div><div class="l">出勤あり</div></div>' +
'<div><div class="n" style="color:var(--danger)">'+ng+'</div><div class="l">未出勤</div></div>' +
'</div>' +
'<div class="card no-print"><label>今日の伝言（本社メモ）</label>' +
'<textarea id="memoBox" class="memo-box" placeholder="例：淀川は10時からに変更／松崎さん休み"></textarea>' +
'<button class="btn sm" style="margin-top:8px" onclick="saveMemo()">保存する</button>' +
'<span id="memoMsg" class="muted" style="margin-left:10px"></span></div>' +
'<div class="board">' + today.map(card).join("") + '</div>' +
(other.length ? '<div class="sec-title">今日は予定のない現場</div><div class="board">' + other.map(card).join("") + '</div>' : "");
}
function saveMemo(){
var t = el("memoBox").value;
db.collection("boardMemos").doc(state.today).set({ text:t, updatedAt:firebase.firestore.FieldValue.serverTimestamp() })
.then(function(){ el("memoMsg").textContent = "保存しました"; setTimeout(function(){ var m=el("memoMsg"); if(m) m.textContent=""; },2000); })
.catch(function(){ el("memoMsg").textContent = "保存できませんでした"; });
}

function viewSites(){
var e = state.editing;
var form = e ? '<div class="card">' +
'<div style="font-size:15px;font-weight:700;margin-bottom:12px">' + (e.id ? "現場をなおす" : "新しい現場") + '</div>' +
'<div class="row"><div><label>現場名</label><input id="fName" value="'+esc(e.name||"")+'"></div>' +
'<div><label>エリア</label><input id="fArea" value="'+esc(e.area||"")+'"></div></div>' +
'<label style="margin-top:14px">入る曜日と時間（曜日ごと）</label>' +
'<div class="dt">' +
DAY_ORDER.map(function(k){
var on = k === "h" ? e.holiday === true : (Array.isArray(e.weekdays) && e.weekdays.indexOf(+k) >= 0);
var t = (e.dayTimes && e.dayTimes[k]) || { s:"", e:"" };
return '<div class="dt-row' + (on ? "" : " off") + (k === "h" ? " hol" : "") + '" id="dtRow'+k+'">' +
'<label class="dt-day"><input type="checkbox" class="fDay" data-k="'+k+'"'+(on?" checked":"")+' onchange="onDayCheck(this)">'+dayLabel(k)+'</label>' +
'<input type="time" class="fDs" data-k="'+k+'" value="'+esc(t.s||"")+'">' +
'<span class="dt-sep">〜</span>' +
'<input type="time" class="fDe" data-k="'+k+'" value="'+esc(t.e||"")+'">' +
'</div>';
}).join("") +
'</div>' +
'<div style="margin-top:8px"><button type="button" class="btn sec sm" onclick="copyFirstTime()">いちばん上の時間を、チェックした曜日ぜんぶに入れる</button></div>' +
'<p class="muted" style="margin:6px 0 0;font-size:12px">入る曜日にチェックして、その日の時間を入れてください。休みの曜日はチェックを外します。' +
'「祝」にチェックすると、祝日（振替休日・国民の休日もふくみます）も入る日になります。チェックしないと、祝日は「今日は予定なし」になります。' +
'祝日の時間が空のときは、その日の曜日の時間を使います。祝日は法律どおりに自動で判定します。</p>' +

'<div class="row" style="margin-top:12px">' +
'<div style="max-width:160px"><label>人数</label><input id="fNum" type="number" min="0" value="'+esc(e.headcount||"")+'"></div>' +
'</div>' +
'<label style="margin-top:12px">メモ</label><input id="fMemo" value="'+esc(e.memo||"")+'">' +
'<div style="display:flex;gap:10px;margin-top:16px">' +
'<button class="btn" onclick="saveSite()">保存</button>' +
'<button class="btn sec" onclick="state.editing=null;render()">やめる</button>' +
(e.id ? '<button class="btn del" style="margin-left:auto" onclick="delSite(\''+e.id+'\')">この現場を消す</button>' : '') +
'</div></div>' : '';

var rows = state.sites.slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||"","ja"); })
.map(function(s){
var wds = Array.isArray(s.weekdays) ? s.weekdays.map(function(i){return WD[i];}).join("・") : "－";
if (s.holiday === true) wds += (wds && wds !== "－" ? "・" : "") + '<b style="color:var(--danger)">祝</b>';
else wds += '<br><span class="muted" style="font-size:11px">祝日は休み</span>';
return '<tr><td>'+esc(s.name)+'<br><span class="muted">'+esc(s.area||"")+'</span></td>' +
'<td>'+wds+'</td><td>'+timeSummary(s)+'</td>' +
'<td>'+(s.headcount||"")+'</td>' +
'<td style="text-align:right"><button class="btn sec sm" onclick=\'editSite("'+s.id+'")\'>なおす</button></td></tr>';
}).join("");

return (e ? form : '<div class="card"><button class="btn" onclick="newSite()">＋ 現場を追加する</button>' +
'<a class="btn sec" style="margin-left:10px" href="'+pageUrl("genba-ikkatsu.html")+'" target="_blank" rel="noopener">📦 まとめて登録する ↗</a></div>') +
'<div class="card"><table><thead><tr><th>現場</th><th>曜日</th><th>時間</th><th>人数</th><th></th></tr></thead>' +
'<tbody>' + (rows || '<tr><td colspan="5" class="muted">まだありません</td></tr>') + '</tbody></table></div>';
}
function newSite(){ state.editing = { name:"", area:"", weekdays:[1,2,3,4,5], holiday:false, startTime:"", endTime:"", dayTimes:{}, headcount:"", memo:"" }; render(); }
function editSite(id){
var s = state.sites.filter(function(x){return x.id===id;})[0];
if (!s) return;
var e = JSON.parse(JSON.stringify(s));
/* 前から登録してある現場は、今までの時間を入る曜日に入れておく */
var dt = e.dayTimes || {};
DAY_ORDER.forEach(function(k){
var on = k === "h" ? e.holiday === true : (Array.isArray(e.weekdays) && e.weekdays.indexOf(+k) >= 0);
if (!(dt[k] && dt[k].s) && on && e.startTime) dt[k] = { s:e.startTime, e:e.endTime || "" };
});
e.dayTimes = dt;
state.editing = e; render();
}
/* 画面の入力を state.editing に写す（1分ごとの画面の書きなおしで、入力が消えないように） */
function captureForm(){
var e = state.editing; if (!e || !el("fName")) return;
e.name = el("fName").value; e.area = el("fArea").value;
e.headcount = el("fNum").value; e.memo = el("fMemo").value;
var wds = [], hol = false, dt = {};
DAY_ORDER.forEach(function(k){
var c = document.querySelector('.fDay[data-k="'+k+'"]');
var on = !!(c && c.checked);
if (k === "h") hol = on; else if (on) wds.push(+k);
dt[k] = { s:(document.querySelector('.fDs[data-k="'+k+'"]')||{}).value || "",
e:(document.querySelector('.fDe[data-k="'+k+'"]')||{}).value || "" };
});
e.weekdays = wds.sort(function(a,b){return a-b;}); e.holiday = hol; e.dayTimes = dt;
}
/* チェックを入れた曜日の時間が空なら、上の曜日の時間を入れておく */
function onDayCheck(c){
var k = c.dataset.k, row = el("dtRow"+k);
if (row) row.classList.toggle("off", !c.checked);
if (!c.checked) return;
var s = document.querySelector('.fDs[data-k="'+k+'"]'), e = document.querySelector('.fDe[data-k="'+k+'"]');
if (s.value) return;
var src = null;
DAY_ORDER.some(function(j){
if (j === k) return false;
var cj = document.querySelector('.fDay[data-k="'+j+'"]'), sj = document.querySelector('.fDs[data-k="'+j+'"]');
if (cj && cj.checked && sj && sj.value){ src = j; return true; }
return false;
});
if (src){ s.value = document.querySelector('.fDs[data-k="'+src+'"]').value; e.value = document.querySelector('.fDe[data-k="'+src+'"]').value; }
}
function copyFirstTime(){
var first = null;
DAY_ORDER.some(function(k){
var c = document.querySelector('.fDay[data-k="'+k+'"]'), sv = document.querySelector('.fDs[data-k="'+k+'"]');
if (c && c.checked && sv && sv.value){ first = k; return true; } return false;
});
if (!first) return alert("先に、いちばん上のチェックした曜日に時間を入れてください");
var fs = document.querySelector('.fDs[data-k="'+first+'"]').value, fe = document.querySelector('.fDe[data-k="'+first+'"]').value;
DAY_ORDER.forEach(function(k){
var c = document.querySelector('.fDay[data-k="'+k+'"]');
if (c && c.checked){ document.querySelector('.fDs[data-k="'+k+'"]').value = fs; document.querySelector('.fDe[data-k="'+k+'"]').value = fe; }
});
}
function saveSite(){
captureForm();
var e = state.editing;
var dayTimes = {}, first = null, missing = [];
DAY_ORDER.forEach(function(k){
var on = k === "h" ? e.holiday : e.weekdays.indexOf(+k) >= 0;
var t = e.dayTimes[k] || { s:"", e:"" };
dayTimes[k] = on ? { s:t.s || "", e:t.e || "" } : { s:"", e:"" };
if (on && !t.s && k !== "h") missing.push(dayLabel(k));
if (on && t.s && !first) first = dayTimes[k];
});
var data = {
name: String(e.name||"").trim(), area: String(e.area||"").trim(), weekdays: e.weekdays,
holiday: !!e.holiday, dayTimes: dayTimes,
startTime: first ? first.s : "", endTime: first ? first.e : "",
headcount: parseInt(e.headcount,10) || 0, memo: String(e.memo||"").trim(), active:true
};
if (!data.name) return alert("現場名を入れてください");
if (missing.length && !confirm(missing.join("・") + " は、開始の時間が入っていません。\n（時間がないと「未出勤」の赤が出ません）\nこのまま保存しますか？")) return;
var p = state.editing.id
? db.collection("sites").doc(state.editing.id).set(data,{merge:true})
: db.collection("sites").add(data);
p.then(function(){ state.editing = null; render(); }).catch(function(err){ alert("保存できませんでした：" + err.message); });
}
function delSite(id){
if (!confirm("この現場を消します。よろしいですか？（貼ってあるQRは使えなくなります）")) return;
db.collection("sites").doc(id).delete().then(function(){ state.editing=null; render(); });
}

function dakokuUrl(id){ return BASE_URL + "dakoku.html?site=" + id; }
function viewQr(){
var sites = state.sites.slice().sort(function(a,b){ return (a.name||"").localeCompare(b.name||"","ja"); });
if (!sites.length) return '<div class="card"><p class="muted">先に現場を登録してください。</p></div>';
var opts = sites.map(function(s){ return '<option value="'+s.id+'"'+(state.qrSite===s.id?" selected":"")+'>'+esc(s.name)+'</option>'; }).join("");
var cur = state.qrSite || sites[0].id;
state.qrSite = cur;
var site = sites.filter(function(s){return s.id===cur;})[0];
return '<div class="card no-print"><div class="row">' +
'<div><label>現場をえらぶ</label><select onchange="state.qrSite=this.value;render()">'+opts+'</select></div>' +
'<div style="flex:0 0 auto"><button class="btn" onclick="printQr()">🖨️ この貼り紙を印刷</button></div>' +
'<div style="flex:0 0 auto"><a class="btn sec" href="'+pageUrl("genba-ikkatsu.html")+'" target="_blank" rel="noopener">📦 全部まとめて印刷 ↗</a></div>' +
'</div><p class="muted" style="margin-top:10px">A4で印刷して、現場のよく見える場所に貼ってください。行きも帰りも同じ1枚を読みます。何枚もいるときは「全部まとめて印刷」が早いです。</p></div>' +
'<div id="qrArea" class="qr-sheet">' +
'<h2>'+esc(site.name)+'</h2>' +
'<p>出勤・退勤はこちらを読んでください</p>' +
'<div class="qbox"><div id="qrBox"></div></div>' +
'<p>スマホのカメラを向けてタップするだけです</p>' +
'<p style="font-size:12px;color:#666;margin-top:10px">合同会社／株式会社ホームメンテナンス</p>' +
'</div>';
}
function drawQr(){
var box = el("qrBox"); if (!box || !state.qrSite) return;
box.innerHTML = "";
new QRCode(box, { text: dakokuUrl(state.qrSite), width:240, height:240, correctLevel: QRCode.CorrectLevel.M });
}
function printQr(){
var a = el("qrArea"); a.classList.add("print-target");
window.print();
setTimeout(function(){ a.classList.remove("print-target"); }, 500);
}

firebase.auth().onAuthStateChanged(function(u){
state.user = u;
if (!u) return renderLogin("");
state.today = todayStr();
startWatch();
render();
});
</script>
</body>
</html>
