<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>アシスト｜アプリ入口</title>
<style>
  :root{
    --orange:#E8873A;
    --orange-dark:#C96A1E;
    --sun-soft:#F7DDBF;
    --bg:#FBF6ED;
    --card:#ffffff;
    --border:#EDE2CE;
    --text:#3A3530;
    --muted:#6B5F52;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 20px 48px;
  }
  .logo{
    width:64px;height:64px;border-radius:18px;
    background:var(--orange);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:32px;margin-bottom:16px;
    box-shadow:0 4px 14px rgba(201,106,30,.25);
  }
  h1{font-size:22px;margin:0 0 4px;font-weight:700;letter-spacing:.04em;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 26px;text-align:center;min-height:18px;}
  .menu{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;}
  .row{
    display:flex;align-items:center;gap:14px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px 18px;
    text-decoration:none;color:inherit;cursor:pointer;
    box-shadow:0 2px 8px rgba(58,53,48,.05);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .row:active{transform:scale(.98);box-shadow:0 1px 4px rgba(58,53,48,.08);}
  .row .ico{
    width:48px;height:48px;border-radius:12px;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:24px;background:var(--sun-soft);
  }
  .row .txt{flex:1;min-width:0;}
  .row .name{font-size:16px;font-weight:700;}
  .row .desc{font-size:12px;color:var(--muted);margin-top:2px;}
  .row .arrow{color:var(--orange);font-size:20px;flex:none;}
  .row.soon{opacity:.6;}
  .row.soon .arrow{color:var(--muted);}
  .back{
    align-self:flex-start;max-width:420px;width:100%;
    background:none;border:none;cursor:pointer;
    color:var(--orange-dark);font-size:14px;font-weight:600;
    padding:0 2px 12px;margin:0;
    display:flex;align-items:center;gap:4px;
  }
  .foot{margin-top:32px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7;}
</style>
</head>
<body>
  <div class="logo">🌞</div>
  <h1>アシスト</h1>
  <p class="sub" id="sub">会社を選んでください</p>

  <button class="back" id="backBtn" style="display:none;" onclick="showCompanies()">‹ 会社選択にもどる</button>

  <nav class="menu" id="menu"></nav>

  <p class="foot">
    このページをブックマーク／ショートカットに登録してお使いください。<br>
    ボタンを押すと自動で最新版が開きます。<br>
    アシスト
  </p>

<script>
  // ==== 設定：会社とツールのURL ====================================
  // URLが決まったら "" の部分に貼り付けてください（"" のままだと「準備中」表示）。
  var COMPANIES = [
    {
      id:"assist", name:"アシスト", sub:"旧ホームメンテナンス",
      apps:{
        roumu:    "https://hminfokeiri-hue.github.io/assist-roumu/assist-roumu.html",
        calendar: "https://hminfokeiri-hue.github.io/assist-calendar/",
        kaikei:   "https://hminfokeiri-hue.github.io/kaikei-assist/assistbuildingmgmt.html"
      }
    },
    {
      id:"alpha", name:"アルファクリーン米子", sub:"",
      apps:{
        roumu:    "",
        calendar: "",
        kaikei:   "https://hminfokeiri-hue.github.io/kaikei/alphacleanyonago.html"
      }
    },
    {
      id:"anago", name:"あなご建物管理", sub:"",
      apps:{
        roumu:    "",
        calendar: "",
        kaikei:   ""
      }
    }
  ];

  var APPS = [
    { key:"roumu",    name:"アシスト労務",      ico:"🗂️", desc:"勤怠・有給・給与明細・発注・連絡" },
    { key:"calendar", name:"アシストカレンダー", ico:"📅", desc:"予定・シフト" },
    { key:"kaikei",   name:"会計ソフト",        ico:"📊", desc:"収支・帳簿・消費税・確定申告" }
  ];
  // ================================================================

  var menu = document.getElementById("menu");
  var sub = document.getElementById("sub");
  var backBtn = document.getElementById("backBtn");

  function openUrl(url){
    var sep = url.indexOf("?") === -1 ? "?" : "&";
    window.location.href = url + sep + "v=" + Date.now();
  }

  function showCompanies(){
    backBtn.style.display = "none";
    sub.textContent = "会社を選んでください";
    menu.innerHTML = "";
    COMPANIES.forEach(function(c){
      var a = document.createElement("div");
      a.className = "row";
      a.innerHTML =
        '<div class="ico">🏢</div>' +
        '<div class="txt"><div class="name">' + c.name + '</div>' +
        (c.sub ? '<div class="desc">' + c.sub + '</div>' : '') + '</div>' +
        '<div class="arrow">›</div>';
      a.addEventListener("click", function(){ showApps(c); });
      menu.appendChild(a);
    });
  }

  function showApps(company){
    backBtn.style.display = "flex";
    sub.textContent = company.name + "　―　使いたいアプリを選んでください";
    menu.innerHTML = "";
    APPS.forEach(function(app){
      var url = company.apps[app.key] || "";
      var ready = url !== "";
      var a = document.createElement("div");
      a.className = "row" + (ready ? "" : " soon");
      a.innerHTML =
        '<div class="ico">' + app.ico + '</div>' +
        '<div class="txt"><div class="name">' + app.name + '</div>' +
        '<div class="desc">' + (ready ? app.desc : "準備中（URL未設定）") + '</div></div>' +
        '<div class="arrow">›</div>';
      a.addEventListener("click", function(){
        if(ready){ openUrl(url); }
        else{ alert(app.name + " はまだ準備中です。URLが決まりしだい使えるようになります。"); }
      });
      menu.appendChild(a);
    });
  }

  showCompanies();
</script>
</body>
</html>
